# Opens the whole site in a real browser on every pull request (and every push to main):
# all five tabs, NPC / player / place pop-ups, a character sheet with a dice roll, a wax seal
# and search, at phone, small-tablet and desktop size. Fails on script errors, missing files,
# pages wider than a phone screen, or pieces that don't show up. Screenshots are attached to
# each run under "Artifacts".
name: Smoke test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
          retention-days: 14
