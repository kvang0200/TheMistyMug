<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Barovian Archive</title>
<meta name="description" content="A player reference for our Curse of Strahd campaign: the party, NPCs, sessions, locations and quests.">
<meta name="robots" content="noindex, nofollow">
<!-- Security policy: only this site's own scripts, styles, fonts and code may load. Portrait images may come from any https site. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0909">
<meta property="og:title" content="The Barovian Archive">
<meta property="og:description" content="Our Curse of Strahd campaign, kept for the players.">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Barovia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/bodoni-moda.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<div class="grain" aria-hidden="true"></div>
<div class="cut" id="cut" aria-hidden="true"></div>

<!-- intro: plays on the first visit of each browser session -->
<div class="intro gone" id="intro" aria-hidden="true">
  <div class="lines">
    <span>Session <span id="introN"></span><span class="bar" style="animation-delay:.2s"></span></span>
    <span class="big">The Barovian Archive<span class="bar" style="animation-delay:.35s"></span></span>
    <span>For the players<span class="bar" style="animation-delay:.5s"></span></span>
  </div>
  <div class="pass"></div>
</div>

<header class="hdr" id="hdr">
  <div class="wrap">
    <a class="brand" href="#home">The Barovian Archive</a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#home">Home<i></i></a>
      <a href="#sessions">Sessions<i></i></a>
      <a href="#npcs">NPCs<i></i></a>
      <a href="#locations">Locations<i></i></a>
      <a href="#quests">Quests<i></i></a>
    </nav>
    <div class="tools">
      <div class="search">
        <label class="sr" for="q">Search the archive</label>
        <input id="q" type="search" placeholder="Search names, places, quests" autocomplete="off">
        <div class="results" id="results" role="listbox" aria-label="Search results"></div>
      </div>
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Search" aria-expanded="false"></button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound effects" aria-pressed="false"></button>
    </div>
  </div>
</header>

<main id="main">
  <section class="view" id="v-home" aria-label="Home"></section>
  <section class="view" id="v-sessions" aria-label="Sessions"></section>
  <section class="view" id="v-npcs" aria-label="NPCs"></section>
  <section class="view" id="v-locations" aria-label="Locations">
    <div class="mist" style="top:120px" aria-hidden="true"></div>
    <div class="section">
      <div class="wrap">
        <div class="head in">
          <div><span class="kick">Locations</span><h2>Where we've <i>been</i></h2></div>
          <div class="mv filters" id="mv" role="group" aria-label="Show as">
            <button type="button" data-mv="map" aria-pressed="true">Map</button>
            <button type="button" data-mv="list" aria-pressed="false">List</button>
          </div>
        </div>
        <div class="map mapframe" id="mapWrap">
          <div class="mapbox" id="mapbox" tabindex="0" aria-label="Map of Barovia. Drag to pan, pinch or scroll to zoom.">
            <div class="stage" id="stage"><img id="mapImg" decoding="async" alt="Map of Barovia" draggable="false"><div class="fog"></div><div class="fog-drift"></div></div>
            <div class="map-ctrl">
              <button id="zIn" type="button" aria-label="Zoom in">+</button>
              <button id="zOut" type="button" aria-label="Zoom out">−</button>
              <button id="zReset" type="button" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            </div>
          </div>
          <div class="map-foot"><span><span class="dash"></span>Our trail</span><span>Unexplored lands lie in the mist · Tap a pin to read about it</span><span>Map: free fan resource shared on Reddit</span></div>
        </div>
        <div class="loc-list" id="locList" hidden></div>
      </div>
    </div>
  </section>
  <section class="view" id="v-quests" aria-label="Quests"></section>
</main>

<footer class="foot">
  <div class="wrap">
    <span class="end">End of the archive<i>.</i></span>
    <span class="label muted" id="footNote"></span>
  </div>
</footer>

<div class="modal" id="modal" aria-hidden="true"></div>
<button class="icon-btn totop" id="toTop" type="button" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>

<script src="js/data.js"></script>
<script src="js/sound.js"></script>
<script src="js/app.js"></script>
</body>
</html>
